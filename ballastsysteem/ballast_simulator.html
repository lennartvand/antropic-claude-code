<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ballastsysteem S-serie</title>
<style>
  :root { --blue:#2e3192; --grn:#39b54a; --red:#ed1c24; --ink:#231f20; --panel:#f4f5f7; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font-family: "Myriad Pro", "Segoe UI", Arial, sans-serif; color:var(--ink); background:#e9ebee; }
  #app { display:grid; grid-template-columns: 1fr 360px; height:100vh; }
  #stage { position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; background:#fff; }
  #stage svg { width:100%; height:100%; display:block; }
  aside { background:var(--panel); border-left:1px solid #cfd3d8; overflow-y:auto; padding:14px 14px 30px; }
  aside h2 { font-size:15px; margin:18px 0 8px; text-transform:uppercase; letter-spacing:.04em; color:#555; }
  aside h2:first-child { margin-top:0; }
  .btns { display:flex; flex-wrap:wrap; gap:6px; }
  button { font:inherit; font-size:14px; padding:8px 11px; border:1px solid #b9bec5; background:#fff; border-radius:6px; cursor:pointer; color:var(--ink); }
  button:hover { background:#eef2ff; }
  button.on { background:var(--blue); color:#fff; border-color:var(--blue); }
  button.big { font-size:15px; font-weight:600; flex:1; }
  label.chk { display:flex; align-items:center; gap:8px; font-size:14px; margin:6px 0; cursor:pointer; }
  select, input[type=number] { font:inherit; font-size:14px; padding:6px; border-radius:6px; border:1px solid #b9bec5; background:#fff; }
  input[type=number] { width:80px; }
  .box { background:#fff; border:1px solid #dde0e4; border-radius:6px; padding:8px 10px; margin-top:8px; }
  .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:5px 0; font-size:14px; }
  .row .lab { min-width:62px; color:#555; }
  .seg { display:inline-flex; border:1px solid #b9bec5; border-radius:6px; overflow:hidden; }
  .seg button { border:0; border-radius:0; padding:6px 10px; border-right:1px solid #b9bec5; }
  .seg button:last-child { border-right:0; }
  .tankchk { display:inline-flex; align-items:center; gap:4px; font-size:14px; margin-right:8px; cursor:pointer; }
  #routeNote { font-size:13px; color:#333; margin-top:6px; }
  ol#steps { padding-left:0; list-style:none; margin:0; counter-reset: s; }
  ol#steps li { counter-increment: s; position:relative; padding:7px 8px 7px 38px; margin:4px 0; border-radius:6px; background:#fff; border:1px solid #dde0e4; font-size:14px; line-height:1.3; }
  ol#steps li::before { content: counter(s); position:absolute; left:8px; top:6px; width:22px; height:22px; border-radius:50%; background:#ccd; color:#fff; font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; }
  ol#steps li.ok { border-color:#9bd3a4; background:#effaf1; }
  ol#steps li.ok::before { content:"✓"; background:var(--grn); }
  ol#steps li.cur { border-color:var(--blue); box-shadow:0 0 0 2px #c9cbf0; }
  ol#steps li.cur::before { background:var(--blue); }
  .note { font-size:12px; color:#666; margin-top:6px; }
  #msgs { list-style:none; padding:0; margin:0; }
  #msgs li { font-size:14px; padding:7px 9px; margin:4px 0; border-radius:6px; border-left:5px solid; background:#fff; }
  #msgs li.info { border-color:#7a8; }
  #msgs li.warn { border-color:#f0a020; background:#fff8e8; }
  #msgs li.alarm { border-color:var(--red); background:#fdecec; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { background:#fff; } }
  table.data { border-collapse:collapse; width:100%; font-size:13px; }
  table.data td, table.data th { padding:3px 4px; border-bottom:1px solid #e3e5e8; text-align:left; vertical-align:top; }
  table.data th { color:#555; font-weight:600; }
  .leeg { color:#b06000; }
  #dlgGegevens { max-width:920px; width:calc(100% - 32px); }
  #dlgGegevens h4 { margin:16px 0 6px; font-size:15px; }
  #dlgGegevens input[type=text] { font:inherit; font-size:14px; padding:5px 6px; border-radius:5px; border:1px solid #b9bec5; width:100%; }
  #dlgGegevens input.num { width:90px; }
  #dlgGegevens input::placeholder { color:#aaa; font-style:italic; }
  #dlgGegevens input.fout { border-color:var(--red); background:#fdecec; }
  #dlgGegevens select { padding:4px; font-size:13px; }
  #dlgGegevens .knoppen { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; position:sticky; bottom:-20px; background:#fff; padding:10px 0; }
  #dlgGegevens .melding { font-size:14px; margin-top:8px; }
  a.over { font-size:13px; color:var(--blue); cursor:pointer; text-decoration:underline; }
  dialog { max-width:720px; border:1px solid #b9bec5; border-radius:10px; padding:20px 24px; font-size:15px; line-height:1.45; }
  dialog::backdrop { background:rgba(0,0,0,.35); }
  dialog h3 { margin:16px 0 6px; font-size:16px; }
  dialog h3:first-child { margin-top:0; }
  #tip { position:absolute; pointer-events:none; background:#222; color:#fff; font-size:13px; padding:5px 8px; border-radius:5px; opacity:0; transition:opacity .15s; white-space:nowrap; }
  @media (max-width: 1000px) { #app { grid-template-columns: 1fr; grid-template-rows: auto auto; height:auto; } #stage { height:72vw; } aside { border-left:0; } }

  /* afdrukken: bladen A3 liggend */
  #printdoc { display:none; }
  @page { size: A3 landscape; margin: 8mm; }
  @media print {
    html, body { height:auto; background:#fff; }
    aside, #tip, dialog { display:none !important; }
    #app { display:block; height:auto; }
    #stage { width:100%; height:279mm; }
    body.printing #printdoc { display:block; break-before:page; font-size:10.5pt; }
  }
  #printdoc h1 { font-size:22pt; margin:0 0 4mm; }
  #printdoc h2 { font-size:13pt; margin:4mm 0 1.5mm; }
  #printdoc .cols { display:grid; grid-template-columns: 1fr 1fr; gap:10mm; }
  #printdoc table { border-collapse:collapse; width:100%; font-size:10pt; }
  #printdoc td, #printdoc th { border:1px solid #888; padding:0.9mm 2mm; text-align:left; vertical-align:top; }
  #printdoc th { background:#eee; }
  #printdoc .open { color:#1d7a2c; font-weight:bold; }
  #printdoc .dicht { color:#c4161c; font-weight:bold; }
  #printdoc .vak { display:inline-block; min-width:28mm; border-bottom:1px solid #000; }
  #printdoc .klein { font-size:9.5pt; color:#444; }
  #printdoc ol li { margin:0.6mm 0; }
  #printdoc.compact td, #printdoc.compact th { padding:0.35mm 2mm; }
  #printdoc.compact h2 { margin:2.5mm 0 1mm; }
  #printdoc p { margin:1.5mm 0; }
</style>
</head>
<body>

<!--
  ================================================================
  SCHEEPSPROFIEL
  ================================================================
  Hier staat alles wat per schip kan verschillen. Open dit bestand in
  Kladblok (of een andere teksteditor), pas de waarden aan en sla op.
  - Een leeg veld (null) betekent: nog niet ingevuld. De simulator toont
    dan "–" of werkt in procenten, op de bladen komt een leeg invulvak.
  - Getallen met een punt schrijven: 3.15 (niet 3,15).
  - Afsluiternamen: alleen invullen als ze aan boord anders heten dan de
    standaardnaam van de S-serie. Voorbeeld:  ze1: "Zuig ejector voor",
  ================================================================
-->
<script id="profiel">
const PROFIEL = {
  schip: "",                       // naam van het schip, bv. "MTS Voorbeeld"
  versie: "2.1 (concept)",

  // Peilen in meter. alarm = hoogwateralarm, max = maximaal niveau, doel = standaard doelpeil bij ballast in.
  peil: {
    T3: { alarm: null, max: null, doel: null },   // Ruim 3
    T2: { alarm: null, max: null, doel: null },   // Ruim 2
    T1: { alarm: null, max: null, doel: null },   // Ruim 1
    UT: { alarm: null, max: null, doel: null },   // U-tank (ballastruimte rond de methanoltank)
  },

  // Diepgang en Sygo-stand (uit het tabellenboek). Voeg zo veel regels toe als nodig.
  diepgang: [
    { omschrijving: "", diepgang: null, sygo: null },
  ],

  // Optioneel: met deze gegevens rekent de simulator met echte tijden en m³.
  capaciteit: { pomp_m3h: null, ejector_m3h: null },
  volume: { T3: null, T2: null, T1: null, UT: null },   // m³ bij maximaal niveau

  // Afwijkende afsluiternamen (sleutel = code uit de lijst STANDAARDNAMEN hieronder).
  namen: {
  },

  // Controlestatus per onderdeel; komt terug onder "Over dit project".
  // status: "gecontroleerd", "besproken", "nog controleren" of "nog invullen".
  controle: [
    { onderdeel: "Opbouw leidingschema S-serie",       status: "besproken",       wanneer: "30-10-2026", opm: "3 ruimen + U-tank, 2 pompen, 2 ejectors, DN50-strips in elk ruim." },
    { onderdeel: "Volgorde bedienen en ruststand",     status: "besproken",       wanneer: "30-10-2026", opm: "Alles klaarzetten, dan pomp starten. Klaar: pomp stop, alles dicht. Buitenboord altijd open." },
    { onderdeel: "Deelafsluiters als routekeuze",      status: "besproken",       wanneer: "30-10-2026", opm: "Meestal één pomp; deelafsluiters alleen open als het water verder moet." },
    { onderdeel: "Afsluiternamen",                     status: "nog controleren", wanneer: "",           opm: "Standaardnamen; controleren met het controleblad." },
    { onderdeel: "U-tank: één vul/zuigleiding",        status: "nog controleren", wanneer: "",           opm: "Drainleiding: aanwezig? waar? afsluiter?" },
    { onderdeel: "DN-maten",                           status: "nog controleren", wanneer: "",           opm: "" },
    { onderdeel: "Peilen, doelpeilen en diepgang",     status: "nog invullen",    wanneer: "",           opm: "Uit het tabellenboek." },
    { onderdeel: "Capaciteiten en volumes",            status: "nog invullen",    wanneer: "",           opm: "Optioneel, voor echte tijden en m³." },
  ],
};
</script>

<div id="app">
  <div id="stage"><svg id="svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1414" preserveAspectRatio="xMidYMid meet"><style>
    .pipe { fill:none; stroke:#231f20; stroke-linejoin:miter; }
    .flow { fill:none; stroke:#2e3192; stroke-width:9; stroke-linecap:butt; stroke-dasharray:22 12; animation: dash .6s linear infinite; }
    .flow.rev { animation-direction: reverse; }
    .flow.paused { animation-play-state: paused; }
    @keyframes dash { to { stroke-dashoffset:-34; } }
    .valve { cursor:pointer; }
    .valve .hit { fill:transparent; }
    .valve:hover .hit { fill:rgba(46,49,146,.12); }
    .vlabel { cursor:pointer; font-weight:bold; }
    .vlabel:hover { fill:#2e3192; }
    .hint { fill:none; stroke:#ff8c00; stroke-width:4; opacity:0; pointer-events:none; }
    .hint.show { opacity:1; animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 50% { stroke-width:8; opacity:.35; } }
    .pump { cursor:pointer; }
    .pump .ring { fill:none; stroke:#fff; stroke-width:5; stroke-dasharray:10 9; opacity:0; transform-box: fill-box; transform-origin: center; }
    .pump.run .ring { opacity:.9; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pump:hover .phit { fill:rgba(46,49,146,.08); }
    .ejbody.active { fill:#cfe6fb; }
    .od { display:none; font-weight:bold; pointer-events:none; }
    .print-only { display:none; }
    svg.printing .od { display:inline; }
    svg.printing .print-only { display:inline; }
    svg.printing .screen-only, svg.printing .flow, svg.printing .hint, svg.printing .ring { display:none; }
  </style></svg><div id="tip"></div></div>
  <aside>
    <h2>Situatie</h2>
    <div class="btns">
      <button class="big" data-scn="in">Ballast in</button>
      <button class="big" data-scn="uit">Ontballasten</button>
      <button class="big" data-scn="vrij">Vrij oefenen</button>
    </div>

    <div class="box" id="taskBox">
      <div class="row"><span class="lab">Ruimen</span><span id="tankChoice"></span></div>
      <div class="row"><span class="lab">Pomp</span>
        <span class="seg" id="pumpChoice">
          <button data-p="achter">Achter</button><button data-p="voor">Voor</button><button data-p="beide">Beide</button>
        </span>
      </div>
      <div id="doelBox"></div>
      <div id="routeNote"></div>
    </div>

    <label class="chk"><input type="checkbox" id="showTarget" checked> Toon wat er nog moet veranderen (oranje)</label>
    <div class="btns">
      <button id="btnTarget">Zet alles in doelstand</button>
      <button id="btnRust">Ruststand</button>
    </div>

    <h2>Stappenplan</h2>
    <ol id="steps"></ol>
    <div class="note" id="stepNote"></div>

    <h2>Meldingen</h2>
    <ul id="msgs"></ul>

    <h2>Peilen &amp; simulatie</h2>
    <div class="btns">
      <button id="lvEmpty">Ruimen leeg</button>
      <button id="lvFull">Ruimen geballast</button>
    </div>
    <div class="btns" style="margin-top:8px;align-items:center">
      <button id="btnPause">⏸ Pauze</button>
      <span style="font-size:14px">Snelheid</span>
      <select id="speed"><option value="1">1×</option><option value="3">3×</option><option value="10">10×</option><option value="30">30×</option><option value="100">100×</option><option value="300">300×</option></select>
    </div>
    <div class="note" id="capNote"></div>

    <h2>Scheepsgegevens</h2>
    <div id="shipData"></div>
    <div class="btns" style="margin-top:8px"><button id="btnGegevens">Gegevens invullen…</button></div>

    <h2>Afdrukken (A3)</h2>
    <div class="btns" style="align-items:center">
      <select id="printKind">
        <option value="in">Blad Ballast in</option>
        <option value="uit">Blad Ontballasten</option>
        <option value="rust">Blad Ruststand</option>
        <option value="controle">Controleblad</option>
      </select>
      <button id="btnPrint">Afdrukken</button>
    </div>
    <div class="note">De bladen gebruiken de keuze voor ruimen en pomp hierboven. Blad 2 bevat de standentabel en de invulvakken.</div>

    <p style="margin-top:22px"><a class="over" id="lnkOver">Over dit project</a></p>
  </aside>
</div>

<div id="printdoc"></div>

<dialog id="dlgGegevens"><div id="gegBody"></div></dialog>

<dialog id="dlgOver">
  <div id="overBody"></div>
  <p style="text-align:right;margin:16px 0 0"><button onclick="this.closest('dialog').close()">Sluiten</button></p>
</dialog>

<script>

};
const naam = id => (PROFIEL.namen && PROFIEL.namen[id]) || STANDAARDNAMEN[id] || id;
const num = v => (typeof v === "number" && isFinite(v)) ? v : null;
const TK = ["T3","UT","T2","T1"];                       // van achter naar voor
const TKNAAM = {T3:"Ruim 3", UT:"U-tank", T2:"Ruim 2", T1:"Ruim 1"};

const BLK="#231f20", BLUE="#2e3192", GRN="#39b54a", RED="#ed1c24", GREY="#c8c8c8";

const HDR=675, RISER={3:400, 2:975, 1:1428};

/* ---------------- peilen uit het profiel ---------------- */
// Intern rekent de simulator met een fractie 0..1 van het maximale niveau.
const P = t => PROFIEL.peil[t] || {};
const maxM = t => num(P(t).max);
const alarmFrac = t => { const a = num(P(t).alarm), m = maxM(t); return a && m ? a / m : null; };
const fmt = (v, d=2) => v.toFixed(d).replace(".", ",");
const lvlTxt = (t, f) => { const m = maxM(t); return m ? fmt(f * m) + " m" : Math.round(f * 100) + " %"; };
const STRIP_FRAC = 0.06;                                 // onder dit peil helpt een open strip iets mee
const IND = { qp: 0.009, qe: 0.0075, vol: {T3:1, T2:1.1, T1:1, UT:0.35} };   // indicatief, per seconde bij 1×
function cap() {
  const c = PROFIEL.capaciteit || {}, v = PROFIEL.volume || {};
  const real = num(c.pomp_m3h) && num(c.ejector_m3h) && TK.every(t => num(v[t]));
  return real ? { real:true, qp:c.pomp_m3h/3600, qe:c.ejector_m3h/3600, vol:v } : { real:false, ...IND };
}

/* ---------------- svg helpers ---------------- */
const svg = document.getElementById("svg");
const NS = "http://www.w3.org/2000/svg";
const layers = {};
for (const n of ["tanks","base","flow","sym","valves","ui"]) { const g=document.createElementNS(NS,"g"); g.id="L_"+n; svg.appendChild(g); layers[n]=g; }
function el(layer, tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  (typeof layer === "string" ? layers[layer] : layer).appendChild(e);
  return e;
}
const group = (layer, cls) => el(layer, "g", cls ? {class:cls} : {});
const PT = pts => pts.map(p=>p.join(",")).join(" ");
const dOf = pts => "M" + pts.map(p=>p.join(" ")).join(" L");
function line(layer, pts, w=4, c=BLK, extra={}) { return el(layer,"polyline",{points:PT(pts),fill:"none",stroke:c,"stroke-width":w,...extra}); }
function poly(layer, pts, fill="#fff", stroke=BLK, w=3, extra={}) { return el(layer,"polygon",{points:PT(pts),fill,stroke,"stroke-width":w,"stroke-linejoin":"miter",...extra}); }
function text(layer, x, y, s, size=14, anchor="start", opt={}) {
  const a = {x,y,"font-family":opt.font||FONT,"font-size":size,"text-anchor":anchor,fill:opt.fill||BLK,"font-weight":opt.weight||"normal"};
  if (opt.rot) a.transform=`rotate(${opt.rot} ${x} ${y})`;
  if (opt.cls) a.class=opt.cls;
  return el(layer,"text",a,s);
}
function tri(cx, cy, ang, L=22, W=18) {
  const a=ang*Math.PI/180, ux=Math.cos(a), uy=Math.sin(a), px=-uy, py=ux;
  return [[cx+ux*L/2, cy+uy*L/2],[cx-ux*L/2+px*W/2, cy-uy*L/2+py*W/2],[cx-ux*L/2-px*W/2, cy-uy*L/2-py*W/2]];
}
const dirArrow = (x,y,ang) => poly("sym", tri(x,y,ang,24,20), BLK, BLK, 1);
function bell(x, y, ang, s=1) {
  const a=ang*Math.PI/180, ux=Math.cos(a), uy=Math.sin(a), px=-uy, py=ux, L=36*s, W=36*s;
  poly("sym", [[x,y],[x-ux*L+px*W/2, y-uy*L+py*W/2],[x-ux*L-px*W/2, y-uy*L-py*W/2]], "#fff", BLK, 4);
}
function checkValve(x, y, up) {
  const L=17, W=12;
  poly("sym", [[x-W,y-2*L],[x+W,y-2*L],[x,y]], up?BLK:"#fff", BLK, 2);
  poly("sym", [[x-W,y+2*L],[x+W,y+2*L],[x,y]], up?"#fff":BLK, BLK, 2);
}
function sea(x, y, anchor, tx) {
  const d = `M${x-20} ${y} q5 -7 10 0 t10 0 t10 0 t10 0 M${x-20} ${y+10} q5 -7 10 0 t10 0 t10 0 t10 0`;
  el("sym","path",{d,fill:"none",stroke:BLUE,"stroke-width":2.5});
  text("sym",tx,y+34,"buitenboord",16,anchor);
  text("sym",tx,y+52,"(altijd open)",12,anchor,{fill:"#555"});
}

/* ---------------- toestand ---------------- */
const level = {T1:0,T2:0,T3:0,UT:0};       // fractie van max. niveau
const doel = {};
for (const t of TK) { const d = num(P(t).doel), m = maxM(t); doel[t] = d && m ? Math.min(1, d/m) : 0.65; }
let scenario = "vrij", paused = false, speed = 3, printKind = null;
const task = { tanks: new Set(["T3","T2","T1"]), pomp: "achter" };
const V = id => VALVES[id].open;
const isOpen = id => !id || VALVES[id].open;
const SIDE = { PA:{pb:"pb_a",pe:"pe_a",ze:"ze3",po:"po3",bu:"bu_a",ej:3}, PV:{pb:"pb_v",pe:"pe_v",ze:"ze1",po:"po1",bu:"bu_v",ej:1} };
const SEG = {T3:0, UT:0, T2:1, T1:2};      // deel van de hoofdleiding: 0 = achter d23, 1 = tussen, 2 = voor d12
const tankValves = t => t==="UT" ? ["ut"] : [`bal${t[1]}bb`,`bal${t[1]}sb`];
const stripValves = () => [3,2,1].flatMap(n => [`str${n}bb`,`str${n}sb`]);
const taskPumps = () => task.pomp==="beide" ? ["PA","PV"] : [task.pomp==="achter" ? "PA" : "PV"];
const taskTanks = () => TK.filter(t => task.tanks.has(t));

function routeDeel() {
  // Welke deelafsluiters moeten open zodat de gekozen pomp(en) de gekozen ruimen bereiken?
  const ps = taskPumps(), ts = taskTanks();
  if (ps.length === 2) return {d23:1, d12:1};
  const p = ps[0]==="PA" ? 0 : 2, r = {d23:0, d12:0};
  for (const t of ts) { const s = SEG[t]; if (Math.min(p,s) < 1 && Math.max(p,s) >= 1) r.d23 = 1; if (Math.min(p,s) < 2 && Math.max(p,s) >= 2) r.d12 = 1; }
  return r;
}
function computeTarget(kind) {
  const t = {};
  for (const id in VALVES) t[id] = 0;
  t.bu_a = t.bu_v = 1; t.PA = t.PV = 0;
  if (kind === "rust" || !kind || kind === "vrij") return t;
  for (const p of taskPumps()) { t[p] = 1; const s = SIDE[p]; if (kind==="in") t[s.pb] = 1; else t[s.pe] = t[s.ze] = t[s.po] = 1; }
  for (const tk of taskTanks()) for (const v of tankValves(tk)) t[v] = 1;
  Object.assign(t, routeDeel());
  if (kind === "uit") for (const v of stripValves()) delete t[v];   // strips: vrij te gebruiken voor restjes
  return t;
}
const target = () => scenario==="vrij" ? null : computeTarget(scenario);
const stateOf = id => VALVES[id] ? (VALVES[id].open?1:0) : (PUMPS[id].on?1:0);
const isRust = () => { const t = computeTarget("rust"); return Object.keys(t).every(id => stateOf(id) === t[id]); };

/* ---------------- stromingsberekening ---------------- */
const tankRoom = t => level[t] < 1 - 1e-4;
function solve() {
  const flows = new Map();               // edgeId -> +1 (a->b) / -1
  const setF = (e, from) => { if (!flows.has(e.id)) flows.set(e.id, e.a===from ? 1 : -1); };
  const msgs = [];
  const C = cap();
  const rate = {T1:0,T2:0,T3:0,UT:0};
  const ejActive = {3:false,1:false}, ejPass = {3:false,1:false};
  const poOf = {3:"po3",1:"po1"};

  // 1) persen vanuit draaiende pompen
  for (const pid of ["PA","PV"]) {
    if (!PUMPS[pid].on) continue;
    const bu = SIDE[pid].bu;
    if (!V(bu)) { msgs.push(["alarm", `${PUMPS[pid].name}: pomp draait droog – ${naam(bu)} is dicht.`]); continue; }
    const cons = [], seen = new Set([pid]);
    const consumer = n => {
      if (n[0]==="T" || n==="UT") return tankRoom(n) ? n : null;
      if (n==="EJ3d" || n==="EJ1d" || n==="EJ3s" || n==="EJ1s") return isOpen(poOf[n[2]]) ? n : null;
      return null;
    };
    const dfs = node => {
      let any = false;
      for (const e of ADJ[node]||[]) {
        if (!isOpen(e.valve)) continue;
        const o = e.a===node ? e.b : e.a;
        if (TERMINAL.has(o)) { const c = consumer(o); if (c) { setF(e,node); cons.push(c); any = true; } continue; }
        if (seen.has(o)) continue; seen.add(o);
        if (dfs(o)) { setF(e,node); any = true; }
      }
      return any;
    };
    dfs(pid);
    const uniq = [...new Set(cons)];
    if (!uniq.length) { msgs.push(["warn", `${PUMPS[pid].name}: pomp draait tegen gesloten afsluiters (geen afvoer).`]); continue; }
    flows.set(pid==="PA" ? "zA" : "zV", 1);
    const share = C.qp / uniq.length;
    for (const c of uniq) {
      if (c[0]==="T" || c==="UT") rate[c] += share / C.vol[c];
      if (c==="EJ3d") ejActive[3] = true;
      if (c==="EJ1d") ejActive[1] = true;
      if (c==="EJ3s") ejPass[3] = true;
      if (c==="EJ1s") ejPass[1] = true;
    }
  }
  for (const k of [3,1]) {
    const pid = k===3 ? "PA" : "PV", pe = k===3 ? "pe_a" : "pe_v";
    if (PUMPS[pid].on && V(SIDE[pid].bu) && V(pe) && !V(poOf[k]))
      msgs.push(["warn", `Ejector ${k}: ${naam(poOf[k])} is dicht, het drijfwater kan nergens heen.`]);
  }

  // 2) zuigen door actieve ejectors
  for (const k of [3,1]) {
    if (!ejActive[k]) continue;
    const zs = k===3 ? "zs3" : "zs1", ze = k===3 ? "ze3" : "ze1";
    const sources = [], viaStrip = new Set();
    let short = false;
    if (V(ze)) {
      const seen = new Set();
      const dfs = node => {
        let any = false;
        for (const e of ADJ[node]||[]) {
          if (!isOpen(e.valve)) continue;
          const o = e.a===node ? e.b : e.a;
          if (TERMINAL.has(o)) {
            if ((o[0]==="T" || o==="UT") && level[o] > 0.002) { setF(e,o); sources.push(o); if (e.id.startsWith("st")) viaStrip.add(o); any = true; }
            if ((o==="PA" || o==="PV") && PUMPS[o].on) short = true;
            continue;
          }
          if (seen.has(o)) continue; seen.add(o);
          if (dfs(o)) { setF(e,o); any = true; }
        }
        return any;
      };
      const e0 = EDGES.find(e => e.id===zs);
      seen.add(e0.a);
      if (dfs(e0.a)) flows.set(zs, 1);
    }
    if (short) msgs.push(["alarm", `Kortsluiting: pompwater gaat via de hoofdleiding direct in ejector ${k} en overboord. Sluit Pers ballast.`]);
    else if (!V(ze)) msgs.push(["info", `Ejector ${k} loopt, maar ${naam(ze)} is dicht.`]);
    else if (!sources.length) msgs.push(["info", `Ejector ${k} loopt, maar zuigt geen water (geen open ruim met water).`]);
    const uniq = [...new Set(sources)];
    if (!short) for (const t of uniq) {
      const boost = viaStrip.has(t) && level[t] < STRIP_FRAC ? 1.3 : 1;
      rate[t] -= C.qe / uniq.length / C.vol[t] * boost;
    }
    flows.set(k===3 ? "dis3" : "dis1", 1);
  }
  for (const k of [3,1]) if (ejPass[k] && !ejActive[k]) {
    flows.set(k===3 ? "dis3" : "dis1", 1);
    msgs.push(["warn", `Pompwater loopt via ${naam(k===3?"ze3":"ze1")} rechtstreeks overboord.`]);
  }

  // 3) procedure-meldingen
  for (const bu of ["bu_a","bu_v"]) if (!V(bu)) msgs.push(["warn", `${naam(bu)} is dicht: het brandbluswater staat niet meer stand-by. Buitenboord hoort altijd open.`]);
  const T = target();
  if (T && (PUMPS.PA.on || PUMPS.PV.on)) {
    const mis = Object.keys(T).filter(id => VALVES[id] && stateOf(id) !== T[id]);
    if (mis.length && !stepDone("start")) msgs.push(["warn", `Pomp gestart terwijl nog niet alles klaarstaat: ${mis.slice(0,4).map(naam).join(", ")}${mis.length>4?" …":""}. Eerst alles klaarzetten, dan pas starten.`]);
  }
  if (scenario==="in") for (const t of taskTanks()) if (level[t] >= doel[t] - 1e-3 && pumpOn()) msgs.push(["warn", `${TKNAAM[t]}: doelpeil bereikt (${lvlTxt(t, doel[t])}). Stop de pomp.`]);
  if (scenario==="uit") for (const t of taskTanks()) if (level[t] <= 0.002 && (PUMPS.PA.on || PUMPS.PV.on)) msgs.push(["info", `${TKNAAM[t]} is leeg.`]);
  return {flows, rate, msgs, ejActive};
}

    {t:tankTxt + ` Deelafsluiters: ${dtxt}.`, c:() => matches([...balIds,"d23","d12"])},
    {t:`Alles staat klaar: start de ${pomp}. De ejector gaat zuigen.`, c:() => allValves() && pumpsOk() && ps.every(p => lastSolve.ejActive[SIDE[p].ej]), start:true},
    {t:"Laat de ruimen leegzuigen. Restje? Eventueel de DN50-strip van dat ruim openen.", c:() => ts.length && ts.every(t => level[t] <= 0.002)},
    {t:"Leeg: stop de pomp en zet alles terug in de ruststand.", c:() => !pumpOn() && isRust() && ts.every(t => level[t] <= 0.002)},

}

function updateSteps() {
  // Voorbereidende stappen blijven 'live' tot de pomp gestart is; daarna worden ze vastgezet.
  const startIdx = STEPS.findIndex(s => s.start);
  let allPrev = true, cur = -1;
  STEPS.forEach((s,i) => {

}
function collectGegevens() {
  const fouten = [];
  const rd = (e, wat) => {
    const s = e.value.trim().replace(",", ".");
    e.classList.remove("fout");
    if (!s) return null;
    const v = Number(s);
    if (!isFinite(v) || v < 0) { e.classList.add("fout"); fouten.push(`${wat}: "${e.value}" is geen getal`); return null; }
    return v;
  };
  const $ = id => document.getElementById(id);
  const p = JSON.parse(JSON.stringify(PROFIEL));
  p.schip = $("g_schip").value.trim();
  p.peil = {}; p.volume = {};
  for (const t of TK) {
    const r = { alarm: rd($("g_"+t+"_alarm"), TKNAAM[t]+" alarm"), max: rd($("g_"+t+"_max"), TKNAAM[t]+" max."), doel: rd($("g_"+t+"_doel"), TKNAAM[t]+" doelpeil") };
    if (r.max !== null && r.alarm !== null && r.alarm > r.max) { $("g_"+t+"_alarm").classList.add("fout"); fouten.push(`${TKNAAM[t]}: alarm ligt boven het max. niveau`); }
    if (r.max !== null && r.doel !== null && r.doel > r.max) { $("g_"+t+"_doel").classList.add("fout"); fouten.push(`${TKNAAM[t]}: doelpeil ligt boven het max. niveau`); }
    p.peil[t] = r; p.volume[t] = rd($("g_"+t+"_vol"), TKNAAM[t]+" volume");
  }
  p.diepgang = [...$("g_dg").rows].map(tr => ({
    omschrijving: tr.querySelector(".dg_o").value.trim(),
    diepgang: rd(tr.querySelector(".dg_d"), "diepgang"),
    sygo: rd(tr.querySelector(".dg_s"), "Sygo-stand"),
  })).filter(r => r.omschrijving || r.diepgang !== null || r.sygo !== null);
  if (!p.diepgang.length) p.diepgang = [{ omschrijving: "", diepgang: null, sygo: null }];
  p.capaciteit = { pomp_m3h: rd($("g_pomp"), "pompcapaciteit"), ejector_m3h: rd($("g_ejector"), "ejectorcapaciteit") };
  p.namen = {};
  document.querySelectorAll("#gegBody .g_naam").forEach(e => { const v = e.value.trim(); if (v && v !== STANDAARDNAMEN[e.dataset.id]) p.namen[e.dataset.id] = v; });
  document.querySelectorAll("#gegBody .g_st").forEach(e => p.controle[+e.dataset.i].status = e.value);
  document.querySelectorAll("#gegBody .g_wn").forEach(e => p.controle[+e.dataset.i].wanneer = e.value.trim());
  document.querySelectorAll("#gegBody .g_opm").forEach(e => p.controle[+e.dataset.i].opm = e.value.trim());
  return { p, fouten };
}
function profielJs(p) {
  // Schrijft het profiel terug in dezelfde, leesbare vorm als bovenin dit bestand.
  const js = x => x === null || x === undefined ? "null" : (typeof x === "number" ? String(x) : JSON.stringify(x).replace(/</g, "\\u003c"));
  const pad = (s, n) => s + " ".repeat(Math.max(1, n - s.length));
  const L = [];
  L.push("const PROFIEL = {");
  L.push(`  ${pad("schip: " + js(p.schip) + ",", 33)}// naam van het schip, bv. "MTS Voorbeeld"`);
  L.push(`  versie: ${js(p.versie)},`, "");
  L.push("  // Peilen in meter. alarm = hoogwateralarm, max = maximaal niveau, doel = standaard doelpeil bij ballast in.", "  peil: {");
  for (const t of ["T3","T2","T1","UT"]) L.push(`    ${pad(`${t}: { alarm: ${js(p.peil[t].alarm)}, max: ${js(p.peil[t].max)}, doel: ${js(p.peil[t].doel)} },`, 50)}// ${t==="UT" ? "U-tank (ballastruimte rond de methanoltank)" : TKNAAM[t]}`);
  L.push("  },", "", "  // Diepgang en Sygo-stand (uit het tabellenboek). Voeg zo veel regels toe als nodig.", "  diepgang: [");
  for (const r of p.diepgang) L.push(`    { omschrijving: ${js(r.omschrijving)}, diepgang: ${js(r.diepgang)}, sygo: ${js(r.sygo)} },`);
  L.push("  ],", "", "  // Optioneel: met deze gegevens rekent de simulator met echte tijden en m³.");
  L.push(`  capaciteit: { pomp_m3h: ${js(p.capaciteit.pomp_m3h)}, ejector_m3h: ${js(p.capaciteit.ejector_m3h)} },`);
  L.push(`  volume: { T3: ${js(p.volume.T3)}, T2: ${js(p.volume.T2)}, T1: ${js(p.volume.T1)}, UT: ${js(p.volume.UT)} },   // m³ bij maximaal niveau`, "");
  L.push("  // Afwijkende afsluiternamen (sleutel = code uit de lijst STANDAARDNAMEN hieronder).", "  namen: {");
  for (const k in p.namen) L.push(`    ${k}: ${js(p.namen[k])},`);
  L.push("  },", "", "  // Controlestatus per onderdeel; komt terug onder \"Over dit project\".", "  // status: \"gecontroleerd\", \"besproken\", \"nog controleren\" of \"nog invullen\".", "  controle: [");
  for (const k of p.controle) L.push(`    { onderdeel: ${js(k.onderdeel)}, status: ${js(k.status)}, wanneer: ${js(k.wanneer)}, opm: ${js(k.opm)} },`);
  L.push("  ],", "};");
  return "\n" + L.join("\n") + "\n";
}
function bouwHtml(p) {
  const open = '<script id="profiel">', i = BRON_HTML.indexOf(open), j = BRON_HTML.indexOf("</" + "script>", i);
  return BRON_HTML.slice(0, i + open.length) + profielJs(p) + BRON_HTML.slice(j);
}
function saveGegevens() {
  const { p, fouten } = collectGegevens(), msg = document.getElementById("g_msg");
  if (fouten.length) { msg.innerHTML = `<span style="color:var(--red)">Niet opgeslagen: ${fouten.map(esc).join("; ")}.</span>`; return; }
  const naamBestand = "ballast_simulator" + (p.schip ? "_" + p.schip.replace(/[^\w-]+/g, "_") : "") + ".html";
  const url = URL.createObjectURL(new Blob([bouwHtml(p)], { type: "text/html" }));
  const a = document.createElement("a"); a.href = url; a.download = naamBestand;
  document.body.appendChild(a); a.click(); a.remove();
  msg.innerHTML = `<b>Opgeslagen als ${esc(naamBestand)}</b> (meestal in de map Downloads).<br>
    Vervang het oude simulatorbestand door dit nieuwe en open het: dan zijn simulator en afdrukbladen bijgewerkt.
    Dit scherm blijft nog de oude gegevens tonen.`;
}
document.getElementById("btnGegevens").onclick = openGegevens;

document.getElementById("lnkOver").onclick = () => {
  const rows = (PROFIEL.controle||[]).map(c => `<tr><td>${c.onderdeel}</td><td style="color:${c.status==="gecontroleerd"?"#1d7a2c":c.status==="besproken"?"#2e3192":"#b06000"}">${c.status}${c.wanneer ? " ("+c.wanneer+")" : ""}</td><td>${c.opm||""}</td></tr>`).join("");
  document.getElementById("overBody").innerHTML = `
    <h3>Over dit project</h3>
    <p>Leidingschema's en een oefensimulator voor het ballastsysteem van de S-serie: ballast in met de ballastpompen, ontballasten met de ejectors.
    Gemaakt met <b>Claude</b> (AI van Anthropic), op basis van de originele Illustrator-tekeningen en de Word-schema's van het systeem.</p>
    <p><b>Wat de AI deed:</b> de tekening opnieuw opbouwen, de simulator programmeren (leidingnet als netwerk van knopen en leidingen, stroming per pomp en ejector), de stappenplannen en de afdrukbladen.<br>
    <b>Wat de vakman deed:</b> de kennis van het systeem aanleveren, keuzes maken en alles controleren en corrigeren.</p>
    <p><b>Techniek:</b> één los HTML-bestand met SVG en JavaScript. Geen installatie, geen internet, geen server. Alles wat per schip verschilt staat in één scheepsprofiel bovenin het bestand.</p>
    <h3>Controlestatus</h3>
    <table class="data"><tr><th>Onderdeel</th><th>Status</th><th>Opmerking</th></tr>${rows}</table>
    <p class="note">Versie ${PROFIEL.versie}. Aan boord geldt altijd de boordinstructie.</p>`;
  document.getElementById("dlgOver").showModal();
};

/* ---------------- afdrukken ---------------- */
let saved = null;
function preparePrint(kind) {
  if (!saved) saved = { valves: Object.fromEntries(Object.values(VALVES).map(v => [v.id, v.open])), pumps: Object.fromEntries(Object.values(PUMPS).map(p => [p.id, p.on])), scenario, title: window.TITLE.textContent };
  printKind = kind;
  const t = computeTarget(kind === "controle" ? "rust" : kind);
  for (const v of stripValves()) if (!(v in t)) t[v] = 0;   // strips op het blad: dicht, alleen voor restjes
  applyState(t);
  window.TITLE.textContent = {in:"Ballast in", uit:"Ontballasten", rust:"Ruststand", controle:"Controleblad"}[kind];
  window.SUBTITLE.textContent = kind === "rust" || kind === "controle" ? "S-serie" : `${taskTanks().map(x => x==="UT" ? "U-tank" : x[1]).join(" + ")} · pomp ${task.pomp}`;
  svg.classList.add("printing"); document.body.classList.add("printing");
  const pd = document.getElementById("printdoc"); pd.innerHTML = printDoc(kind, t); pd.classList.toggle("compact", kind === "controle");
  render();
}
function endPrint() {
  if (!saved) return;
  for (const id in saved.valves) VALVES[id].open = saved.valves[id];
  for (const id in saved.pumps) PUMPS[id].on = saved.pumps[id];
  window.TITLE.textContent = saved.title; window.SUBTITLE.textContent = "interactieve versie";
  saved = null; printKind = null;
  svg.classList.remove("printing"); document.body.classList.remove("printing");
}
const vak = v => num(v)!==null ? fmt(v) + " m" : '<span class="vak">&nbsp;</span>';
function peilTabel() {
  let h = `<table><tr><th></th><th>Hoogwateralarm</th><th>Max. niveau</th><th>Doelpeil</th><th>Volume bij max.</th></tr>`;
  for (const t of TK) { const vol = (PROFIEL.volume||{})[t]; h += `<tr><td>${TKNAAM[t]}</td><td>${vak(P(t).alarm)}</td><td>${vak(P(t).max)}</td><td>${vak(P(t).doel)}</td><td>${num(vol)!==null ? vol+" m³" : '<span class="vak">&nbsp;</span>'}</td></tr>`; }
  h += `</table><table style="margin-top:3mm"><tr><th>Omschrijving</th><th>Diepgang</th><th>Sygo-stand</th></tr>`;
  const rows = (PROFIEL.diepgang||[]).filter(r => r.omschrijving || num(r.diepgang)!==null);
  for (const r of rows) h += `<tr><td>${r.omschrijving||""}</td><td>${vak(r.diepgang)}</td><td>${num(r.sygo)!==null ? r.sygo+" mt" : '<span class="vak">&nbsp;</span>'}</td></tr>`;
  for (let i = rows.length; i < 3; i++) h += `<tr><td>&nbsp;</td><td></td><td></td></tr>`;
  const c = PROFIEL.capaciteit||{};
  h += `</table><p>Pompcapaciteit: ${num(c.pomp_m3h)!==null ? c.pomp_m3h+" m³/h" : '<span class="vak">&nbsp;</span> m³/h'} &nbsp;&nbsp; Ejector: ${num(c.ejector_m3h)!==null ? c.ejector_m3h+" m³/h" : '<span class="vak">&nbsp;</span> m³/h'}</p>`;
  return h;
}
function printDoc(kind, t) {
  const kop = `Ballastsysteem S-serie${PROFIEL.schip ? " – " + PROFIEL.schip : ""}`;
  const voet = `<p class="klein">Versie ${PROFIEL.versie}. Aan boord geldt altijd de boordinstructie.</p>`;
  if (kind === "controle") {
    let h = `<h1>Controleblad – ${kop}</h1><p>Loop elke afsluiter na (nummer = nummer op blad 1). Vink aan of de plek klopt en schrijf de naam op zoals hij aan boord heet, als die anders is.</p>`;
    h += `<table><tr><th>Nr</th><th>Afsluiter in de simulator</th><th>Plek klopt</th><th>Naam aan boord (als anders)</th><th>Opmerking</th></tr>`;
    for (const v of Object.values(VALVES)) h += `<tr><td>${v.nr}</td><td>${naam(v.id)}</td><td>☐ ja &nbsp; ☐ nee</td><td style="width:70mm"></td><td style="width:70mm"></td></tr>`;
    h += `</table><h2>Open vragen</h2><ol>
      <li>U-tank: is het één leiding voor vullen én zuigen? Maat (DN): ______ &nbsp; Drainleiding aanwezig? ☐ ja ☐ nee – waar / welke afsluiter: ____________________</li>
      <li>Buitenboord: heeft elke machinekamer één buitenboordafsluiter voor de ballastpomp? ☐ ja ☐ nee – naam aan boord: ____________________</li>
      <li>DN-maten: Pers ballast achter ______ · voor DN150? ______ · drijfwater DN125? ______ · overboord DN200? ______ · zuigmonden DN100? ______ · strips DN50? ______</li>
      <li>Stripleidingen: BB voor en SB achter in elk ruim? ☐ ja ☐ nee – opmerking: ____________________</li>
      <li>Ontbreekt er iets op het schema (afsluiter, leiding, peilbuis)? ________________________________________</li>
    </ol><h2>Scheepsgegevens</h2>${peilTabel()}
    <p style="margin-top:6mm">Gecontroleerd door: <span class="vak" style="min-width:60mm">&nbsp;</span> &nbsp; Datum: <span class="vak">&nbsp;</span> &nbsp; Schip: <span class="vak" style="min-width:50mm">&nbsp;</span></p>${voet}`;
    return h;
  }
  const titel = {in:"Ballast in", uit:"Ontballasten", rust:"Ruststand"}[kind];
  let rows = "";
  for (const v of Object.values(VALVES)) {
    let st = t[v.id] ? '<span class="open">OPEN</span>' : '<span class="dicht">DICHT</span>', opm = "";
    if (v.id.startsWith("str")) opm = "alleen voor restjes";
    if (v.id.startsWith("bu_")) opm = "altijd open (brandblus stand-by)";
    if (v.id === "d23" || v.id === "d12") opm = "routekeuze, zie rechts";
    rows += `<tr><td>${v.nr}</td><td>${naam(v.id)}</td><td>${st}</td><td class="klein">${opm}</td></tr>`;
  }
  let h = `<h1>${titel} – ${kop}</h1>`;
  if (kind !== "rust") h += `<p>Getekend voor: <b>${lijst(taskTanks().map(x => TKNAAM[x]))}</b>, pomp <b>${task.pomp}</b>.</p>`;
  h += `<div class="cols"><div><h2>Standen van de afsluiters</h2><table><tr><th>Nr</th><th>Afsluiter</th><th>Stand</th><th>Opmerking</th></tr>${rows}</table></div><div>`;
  if (kind !== "rust") {
    const saveSc = scenario; scenario = kind; const st = buildSteps(); scenario = saveSc;
    h += `<h2>Volgorde</h2><ol>${st.map(s => `<li>${s.t}</li>`).join("")}</ol>`;
  } else h += `<h2>Ruststand</h2><p>Na elke klus: pompen uit, alle afsluiters dicht. Alleen de buitenboordafsluiters blijven open, zodat het brandbluswater stand-by blijft.</p>`;
  h += `<h2>Deelafsluiters: routekeuze</h2><table><tr><th>Pomp</th><th>Ruimen</th><th>${naam("d23")}</th><th>${naam("d12")}</th></tr>
    <tr><td>Achter</td><td>alleen ruim 3 / U-tank</td><td class="dicht">dicht</td><td class="dicht">dicht</td></tr>
    <tr><td>Achter</td><td>tot en met ruim 2</td><td class="open">open</td><td class="dicht">dicht</td></tr>
    <tr><td>Achter</td><td>tot en met ruim 1</td><td class="open">open</td><td class="open">open</td></tr>
    <tr><td>Voor</td><td>alleen ruim 1</td><td class="dicht">dicht</td><td class="dicht">dicht</td></tr>
    <tr><td>Voor</td><td>tot en met ruim 2</td><td class="dicht">dicht</td><td class="open">open</td></tr>
    <tr><td>Voor</td><td>tot en met ruim 3 / U-tank</td><td class="open">open</td><td class="open">open</td></tr>
    <tr><td>Beide</td><td>alle ruimen</td><td class="open">open</td><td class="open">open</td></tr></table>
    <h2>Scheepsgegevens</h2>${peilTabel()}</div></div>${voet}`;
  return h;
}
document.getElementById("btnPrint").onclick = () => { preparePrint(document.getElementById("printKind").value); setTimeout(() => window.print(), 50); };
window.addEventListener("afterprint", endPrint);
window.preparePrint = preparePrint; window.endPrint = endPrint;

setScenario("vrij");
requestAnimationFrame(tick);
</script>
